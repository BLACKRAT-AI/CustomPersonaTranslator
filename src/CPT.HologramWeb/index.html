<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CPT Hologram</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #eaeaea;
  }
  /* Two stacked canvases: the border and spinner underneath, the projected head
     on top. Separating them lets the border run at a capped frame rate while the
     head stays at full rate for the lip-sync. */
  #stage { position: relative; height: 100vh; }
  #stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { z-index: 0; }
  #holo { z-index: 1; }

  #toast {
    position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 2;
    padding: 7px 10px; border-radius: 7px;
    background: rgba(20,20,20,0.88); border: 1px solid #3a3a3a;
    font-size: 11px; line-height: 1.35; color: #cfcfcf;
    opacity: 0; transition: opacity 200ms ease;
    pointer-events: none;
  }
  #toast.shown { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="glow"></canvas>
    <canvas id="holo"></canvas>
    <div id="toast"></div>
  </div>

<script type="module">
import { Hologram } from './hologram.js';
import { Prismatic } from './prismatic.js';

const hologram = new Hologram(document.getElementById('holo'));
const glow = new Prismatic(document.getElementById('glow'));
const toast = document.getElementById('toast');

// The border owns the phase and the spinner's geometry; the hologram reads both
// so the projection leaves the ring in step with the colours running round it.
hologram.ring = glow;
glow.start();
hologram.start();

let toastTimer = 0;
function showToast(text) {
  toast.textContent = text;
  toast.classList.add('shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('shown'), 4200);
}

function setState(state) {
  hologram.setState(state);
  glow.setState(state === 'speaking' ? 'speaking' : state === 'thinking' ? 'busy' : 'idle');
}

function apply(message) {
  switch (message.type) {
    case 'persona':
      // "prismatic" (or nothing) gives the full spectrum; a persona's own colour
      // is tinted around itself so the spinner and border still read as moving.
      hologram.setPalette(message.color);
      glow.setPalette(message.color);
      break;

    case 'appear':
      hologram.talking = true;
      setState('speaking');
      break;

    // The amplitude of the audio being heard right now, sixty times a second.
    // This is the lip-sync: it drives the jaw directly.
    case 'level':
      hologram.setMouth(Number(message.level) || 0);
      break;

    // A chunk of the reply arriving is a word boundary — pulse the mouth so it
    // still moves if the audio level is unavailable.
    case 'transcript_chunk':
      hologram.mouthHit(0.5);
      break;

    case 'sending':
    case 'transcript_clear':
      hologram.talking = false;
      setState('idle');
      break;

    case 'thinking':
      setState('thinking');
      break;

    case 'toast':
      showToast(String(message.text || ''));
      break;
  }
}

window.chrome.webview.addEventListener('message', (event) => {
  // PostWebMessageAsJson delivers an already-parsed object; accept a string too
  // so a command is never silently dropped over how the host sent it.
  let message = event.data;
  if (typeof message === 'string') {
    try { message = JSON.parse(message); } catch { return; }
  }
  if (message && message.type) apply(message);
});

window.addEventListener('resize', () => { hologram.relayout(); glow.start(); });

window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
</script>
</body>
</html>
