<!doctype html>
<html><head><meta charset="utf-8"><title>CPT Hologram</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
               font-family: 'Segoe UI', sans-serif; color: #eaeaea; height: 100%; }
  /* Projector-bar layout: the only thing this page renders is the hologram
     canvas — the WPF window owns the bar, mic and toolbar. */
  #stage { display: flex; flex-direction: column; height: 100vh; padding: 0; box-sizing: border-box; gap: 0; }
  #holo { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden;
          background: transparent; border: none; }
  #holo.hidden { display: none; }
  #personaCanvas { width: 100%; height: 100%; display: block; }
  /* Audio mic / transcript / toggle live in the WPF bar now. */
  #controls, #toggleVisual, #transcript { display: none !important; }
  #status { position: absolute; top: 6px; right: 10px; font-size: 10px; opacity: 0.55; letter-spacing: 1px;
            color: #8c8c8c; text-transform: uppercase; }
  /* Legacy in-page toggle hidden; the WPF header bar now owns the show/hide affordance. */
  #toggleVisual { display: none; }

  #transcript { display: none; flex: 0 0 auto; max-height: 30vh; overflow-y: auto;
                background: rgba(255,255,255,0.04); border: 1px solid #2b2b2b;
                border-radius: 4px; padding: 6px 10px; font-size: 12px; line-height: 1.45; color: #cfcfcf; }
  #transcript.shown { display: block; }

  /* Hologram-hidden mode: a compact docked bar with the audio-graph button only. */
  body.audioOnly { background: transparent; }
  body.audioOnly #stage { padding: 6px; gap: 0; }

  /* The single push-to-talk control. The waveform is rendered inside via canvas. */
  #controls { flex: 0 0 auto; }
  #mic { position: relative; width: 100%; height: 52px; padding: 0; margin: 0;
         background: #2b2b2b; border: 1px solid #333333;
         border-radius: 6px; cursor: pointer; user-select: none; overflow: hidden;
         display: block; }
  #mic:hover { background: #3a3a3a; }
  #mic.active { background: #4a3030; border-color: #6a4040; }
  #wave { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #micIcon { position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
             pointer-events: none; opacity: 0.9; }
  body.audioOnly #mic { height: 44px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="holo">
      <canvas id="personaCanvas"></canvas>
      <button id="toggleVisual" title="Hide / show persona visual">hide visual</button>
      <div id="status">idle</div>
    </div>
    <div id="transcript"></div>
    <div id="controls">
      <button id="mic" aria-label="Push to talk">
        <canvas id="wave"></canvas>
        <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#eaeaea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="hologram.js"></script>
</body></html>
